<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星幻指揮中心 - 粉嫩觀測站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- 基礎粉嫩設定 --- */
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            /* 夢幻粉藍漸層背景 */
            background: linear-gradient(135deg, #fff1f2 0%, #e0f2fe 100%);
            color: #475569; 
            margin: 0; 
            min-height: 100vh; 
            overflow-x: hidden; 
            position: relative;
        }

        /* --- 1. 夢幻星星背景 --- */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.5) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.4) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.3) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            z-index: -1;
            opacity: 0.9; /* 在亮色背景下稍微顯眼一點 */
        }

        /* --- 2. 動態流星雨 (白潤感) --- */
        .shooting-stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .shooting-star {
            position: absolute;
            width: 120px;
            height: 2px;
            /* 輕盈的白色流星 */
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(-35deg);
            opacity: 0;
            animation: shoot 8s linear infinite;
        }

        @keyframes shoot {
            0% { transform: rotate(-35deg) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: rotate(-35deg) translateX(-1200px); opacity: 0; }
            100% { transform: rotate(-35deg) translateX(-1200px); opacity: 0; }
        }

        /* 設定不同流星的延遲和位置 */
        .shooting-star:nth-child(1) { top: 5%; right: 15%; animation-delay: 0s; }
        .shooting-star:nth-child(2) { top: 25%; right: -5%; animation-delay: 1.5s; animation-duration: 10s; }
        .shooting-star:nth-child(3) { top: 45%; right: 25%; animation-delay: 3s; animation-duration: 7s; }
        .shooting-star:nth-child(4) { top: 10%; right: 35%; animation-delay: 5s; }
        .shooting-star:nth-child(5) { top: 65%; right: 10%; animation-delay: 7s; animation-duration: 13s;}

        /* --- 3. 白潤玻璃介面 --- */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.5); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.7); 
            /* 輕盈的陰影 */
            box-shadow: 0 10px 30px rgba(244, 114, 182, 0.05); 
            border-radius: 1.25rem; 
        }

        /* --- 4. 粉嫩霓虹文字 --- */
        .metallic-text { 
            background: linear-gradient(to right, #7dd3fc 0%, #f472b6 33%, #d8b4fe 66%, #7dd3fc 100%); 
            background-size: 200% auto;
            color: transparent; 
            -webkit-background-clip: text; 
            background-clip: text; 
            font-weight: 900; 
            animation: metallicFlow 6s linear infinite;
            /* 柔和的粉色發光 */
            filter: drop-shadow(0 0 3px rgba(244,114,182,0.4));
        }

        @keyframes metallicFlow { to { background-position: 200% center; } }

        /* --- 5. 數據卡片珍珠光澤 shadow --- */
        .stat-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(244, 114, 182, 0.4);
            /* 珍珠彩光陰影 */
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.15), 0 0 10px rgba(125, 211, 252, 0.1);
        }

        /* 職位標籤 (維持原本粉嫩感) */
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-align: center; }
        .badge-pilot { background: #e0f2fe; color: #0284c7; text-transform: uppercase;}
        .badge-engineer { background: #f3e8ff; color: #7e22ce; text-transform: uppercase;}
        .badge-scientist { background: #fce7f3; color: #db2777; text-transform: uppercase;}
        .badge-other { background: #f1f5f9; color: #64748b; }

        /* 載入動畫 (粉嫩) */
        .loading-dot { animation: loadingBreath 1.5s ease-in-out infinite; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes loadingBreath { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }

        /* 表格進場動畫 */
        #tableBody tr {
            opacity: 0;
            transform: translateY(20px);
            animation: trSlideIn 0.5s ease forwards;
        }
        #tableBody tr:nth-child(1) { animation-delay: 0.1s; }
        #tableBody tr:nth-child(2) { animation-delay: 0.2s; }
        #tableBody tr:nth-child(3) { animation-delay: 0.3s; }
        @keyframes trSlideIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
