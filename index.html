<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星幻指揮中心 - 儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background: linear-gradient(135deg, #fff5f8 0%, #f0f4ff 100%); min-height: 100vh; margin: 0; }
        .glass-panel { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 1.5rem; }
        .metallic-text { background: linear-gradient(to right, #60a5fa, #f472b6, #c084fc); -webkit-background-clip: text; color: transparent; font-weight: 900; }
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-align: center; }
        .badge-pilot { background: #bae6fd; color: #0284c7; }
        .badge-engineer { background: #e9d5ff; color: #7e22ce; }
        .badge-scientist { background: #fbcfe8; color: #db2777; }
        .badge-other { background: #f1f5f9; color: #64748b; }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        <div class="glass-panel p-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h2 style="font-family:'Orbitron'" class="text-sky-400 tracking-widest text-xs font-bold uppercase">Command Center</h2>
                <h1 class="text-3xl sm:text-4xl metallic-text">即時報名指揮中心</h1>
            </div>
            <button onclick="fetchData()" class="px-6 py-3 bg-white text-pink-500 font-bold rounded-xl shadow-lg hover:scale-105 transition-transform active:scale-95">同步資料</button>
        </div>

        <div id="loadingScreen" class="text-center py-20 text-pink-400 font-bold">正在接收星際數據...</div>

        <div id="dashboardContent" class="hidden space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 text-center">
                <div class="glass-panel p-6 shadow-sm"><p class="text-gray-500 text-sm font-bold">總人數</p><h3 class="text-4xl font-black" id="totalCount">0</h3></div>
                <div class="glass-panel p-6 shadow-sm border-b-4 border-sky-400"><p class="text-sky-500 text-sm font-bold uppercase">Pilot</p><h3 class="text-4xl font-black text-sky-600" id="pilotCount">0</h3></div>
                <div class="glass-panel p-6 shadow-sm border-b-4 border-purple-400"><p class="text-purple-500 text-sm font-bold uppercase">Engineer</p><h3 class="text-4xl font-black text-purple-600" id="engineerCount">0</h3></div>
                <div class="glass-panel p-6 shadow-sm border-b-4 border-pink-400"><p class="text-pink-500 text-sm font-bold uppercase">Scientist</p><h3 class="text-4xl font-black text-pink-600" id="scientistCount">0</h3></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="glass-panel p-6 flex flex-col items-center shadow-sm">
                    <h3 class="font-bold mb-4 text-gray-700">職位比例</h3>
                    <div class="w-full max-w-[220px] aspect-square"><canvas id="roleChart"></canvas></div>
                </div>
                <div class="glass-panel p-6 lg:col-span-2 overflow-x-auto shadow-sm">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-pink-500 border-b border-pink-100">
                                <th class="p-3">姓名</th>
                                <th class="p-3 text-center">派駐職位</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 你的專屬 API 網址 (已包含 get_data=1)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxOEVtSZ7GbuI30JX-ge2_X9az1J9hu_sB0VP4M7gWYD9acsPkkHr_Q8M7wrYbfaYwW/exec?get_data=1';
        let chartInstance = null;

        function fetchData() {
            document.getElementById('loadingScreen').classList.remove('hidden');
            document.getElementById('dashboardContent').classList.add('hidden');
            
            fetch(scriptURL)
                .then(res => res.json())
                .then(res => {
                    if (res.result === 'success') {
                        render(res.data || []);
                    }
                })
                .catch(err => console.error("Error:", err))
                .finally(() => {
                    document.getElementById('loadingScreen').classList.add('hidden');
                    document.getElementById('dashboardContent').classList.remove('hidden');
                });
        }

        function render(data) {
            let counts = { p: 0, e: 0, s: 0 };
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            // 倒序顯示，最新的在最上面
            [...data].reverse().forEach(item => {
                const r = String(item.role || "").toLowerCase().trim();
                let badgeClass = 'badge-other';
                
                // 強大模糊辨識邏輯 (不分大小寫)
                if (r.includes('pilot')) { counts.p++; badgeClass = 'badge-pilot'; }
                else if (r.includes('engineer')) { counts.e++; badgeClass = 'badge-engineer'; }
                else if (r.includes('scientist')) { counts.s++; badgeClass = 'badge-scientist'; }

                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-50/50 hover:bg-white/40 transition-colors";
                tr.innerHTML = `
                    <td class="p-3 font-bold text-gray-700">${item.name || 'Unknown'}</td>
                    <td class="p-3 text-center"><span class="badge ${badgeClass}">${item.role}</span></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalCount').innerText = data.length;
            document.getElementById('pilotCount').innerText = counts.p;
            document.getElementById('engineerCount').innerText = counts.e;
            document.getElementById('scientistCount').innerText = counts.s;
            updateChart(counts);
        }

        function updateChart(c) {
            const ctx = document.getElementById('roleChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Pilot','Engineer','Scientist'],
                    datasets: [{
                        data: [c.p, c.e, c.s],
                        backgroundColor: ['#38bdf8', '#c084fc', '#f472b6'],
                        borderWidth: 0
                    }]
                },
                options: { 
                    plugins: { legend: { position: 'bottom', labels: { usePointStyle: true } } },
                    maintainAspectRatio: false
                }
            });
        }

        window.onload = fetchData;
    </script>
</body>
</html>
