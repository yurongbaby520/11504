<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星幻指揮中心 - 夢幻數據端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- 基礎夢幻設定 --- */
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background: linear-gradient(135deg, #fff5f8 0%, #f0f4ff 100%); 
            color: #4a4a4a; 
            margin: 0; 
            min-height: 100vh; 
            overflow-x: hidden; 
            position: relative;
        }

        /* --- 1. 動態背景浮球 --- */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: floatOrbs 10s ease-in-out infinite alternate;
        }
        .orb-1 { width: 40vw; height: 40vw; background: #fbcfe8; top: -10%; left: -10%; }
        .orb-2 { width: 50vw; height: 50vw; background: #bae6fd; bottom: -20%; right: -10%; animation-delay: -5s; }
        .orb-3 { width: 30vw; height: 30vw; background: #e9d5ff; top: 40%; left: 30%; animation-duration: 15s; }

        @keyframes floatOrbs {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(20px, 30px) scale(1.1); }
        }

        /* --- 2. 強化玻璃擬態 --- */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 0 15px 40px rgba(244, 114, 182, 0.1); 
            border-radius: 1.5rem; 
        }

        /* --- 3. 霓虹文字呼吸燈 --- */
        .metallic-text { 
            background: linear-gradient(to right, #60a5fa 0%, #f472b6 33%, #c084fc 66%, #60a5fa 100%); 
            background-size: 200% auto;
            color: transparent; 
            -webkit-background-clip: text; 
            background-clip: text; 
            font-weight: 900; 
            animation: metallicFlow 6s linear infinite, neonBreath 2s ease-in-out infinite alternate;
        }

        @keyframes metallicFlow { to { background-position: 200% center; } }
        @keyframes neonBreath {
            0% { filter: drop-shadow(0 0 2px rgba(244,114,182,0.3)); }
            100% { filter: drop-shadow(0 0 8px rgba(244,114,182,0.8)); }
        }

        /* --- 4. 數據卡片流光動畫 --- */
        .stat-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 20px rgba(96, 165, 250, 0.1);
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(244, 114, 182, 0.2);
        }

        /* --- 其他樣式修補 --- */
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-align: center; }
        .badge-pilot { background: #bae6fd; color: #0284c7; text-transform: uppercase;}
        .badge-engineer { background: #e9d5ff; color: #7e22ce; text-transform: uppercase;}
        .badge-scientist { background: #fbcfe8; color: #db2777; text-transform: uppercase;}
        .badge-other { background: #f1f5f9; color: #64748b; }

        /* --- 載入動畫 (夢幻) --- */
        .loading-dot { animation: loadingBreath 1.5s ease-in-out infinite; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes loadingBreath { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }

        /* --- 5. 表格進場動畫 --- */
        #tableBody tr {
            opacity: 0;
            transform: translateY(20px);
            animation: trSlideIn 0.5s ease forwards;
        }
        #tableBody tr:nth-child(1) { animation-delay: 0.1s; }
        #tableBody tr:nth-child(2) { animation-delay: 0.2s; }
        #tableBody tr:nth-child(3) { animation-delay: 0.3s; }
        #tableBody tr:nth-child(4) { animation-delay: 0.4s; }
        #tableBody tr:nth-child(5) { animation-delay: 0.5s; }

        @keyframes trSlideIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="max-w-7xl mx-auto space-y-8 relative z-10">
        <div class="glass-panel p-6 sm:p-10 flex flex-col sm:flex-row justify-between items-center gap-6 shadow-sm">
            <div>
                <h2 style="font-family:'Orbitron'" class="text-sky-400 tracking-[0.3em] text-xs font-bold mb-2 uppercase">Command Center Dashboard</h2>
                <h1 class="text-3xl sm:text-4xl metallic-text tracking-wider">即時報名指揮中心</h1>
            </div>
            <button onclick="fetchData()" id="refreshBtn" class="flex items-center gap-2 px-6 py-3 bg-white hover:bg-white text-pink-500 font-bold rounded-xl shadow-[0_4px_15px_rgba(244,114,182,0.2)] hover:shadow-[0_8px_25px_rgba(244,114,182,0.3)] transition-all active:scale-95">
                <span id="refreshIcon" class="hidden animate-spin">♻️</span>
                同步星際數據
            </button>
        </div>

        <div id="loadingScreen" class="flex flex-col items-center justify-center py-20">
            <div class="flex space-x-2 mb-4">
                <div class="w-3 h-3 bg-pink-400 rounded-full loading-dot"></div>
                <div class="w-3 h-3 bg-purple-400 rounded-full loading-dot"></div>
                <div class="w-3 h-3 bg-sky-400 rounded-full loading-dot"></div>
            </div>
            <p class="text-pink-400 font-medium">解碼來自 Google Sheets 的信號...</p>
        </div>

        <div id="dashboardContent" class="hidden space-y-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="glass-panel p-6 shadow-sm"><p class="text-gray-500 text-sm font-bold">總人數</p><h3 class="text-4xl font-black" id="totalCount">0</h3></div>
                <div class="glass-panel p-6 shadow-sm border-l-4 border-sky-400"><p class="text-sky-500 text-sm font-bold uppercase">Pilot</p><h3 class="text-4xl font-black text-sky-600" id="pilotCount">0</h3></div>
                <div class="glass-panel p-6 shadow-sm border-l-4 border-purple-400"><p class="text-purple-500 text-sm font-bold uppercase">Engineer</p><h3 class="text-4xl font-black text-purple-600" id="engineerCount">0</h3></div>
                <div class="glass-panel p-6 shadow-sm border-l-4 border-pink-400"><p class="text-pink-500 text-sm font-bold uppercase">Scientist</p><h3 class="text-4xl font-black text-pink-600" id="scientistCount">0</h3></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="glass-panel p-6 flex flex-col items-center shadow-sm">
                    <h3 class="font-bold mb-4 text-gray-700">職位佔比</h3>
                    <div class="w-full max-w-[200px] aspect-square"><canvas id="roleChart"></canvas></div>
                </div>
                <div class="glass-panel p-6 lg:col-span-2 overflow-x-auto shadow-sm">
                    <h3 class="font-bold mb-4 text-gray-700">最新登錄成員</h3>
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-pink-500 border-b border-pink-100">
                                <th class="p-3 text-sm font-bold">成員姓名</th>
                                <th class="p-3 text-center text-sm font-bold">派駐職位</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 你的專屬 API 網址 (已包含 get_data=1)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxOEVtSZ7GbuI30JX-ge2_X9az1J9hu_sB0VP4M7gWYD9acsPkkHr_Q8M7wrYbfaYwW/exec?get_data=1';
        let chartInstance = null;

        function fetchData() {
            document.getElementById('loadingScreen').classList.remove('hidden');
            document.getElementById('dashboardContent').classList.add('hidden');
            document.getElementById('refreshIcon').classList.remove('hidden');
            
            fetch(scriptURL)
                .then(res => res.json())
                .then(res => {
                    if (res.result === 'success') {
                        render(res.data || []);
                    }
                })
                .catch(err => console.error("Error:", err))
                .finally(() => {
                    document.getElementById('loadingScreen').classList.add('hidden');
                    document.getElementById('dashboardContent').classList.remove('hidden');
                    document.getElementById('refreshIcon').classList.add('hidden');
                });
        }

        function render(data) {
            let counts = { p: 0, e: 0, s: 0 };
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            // 倒序顯示，最新的在最上面
            [...data].reverse().forEach(item => {
                const r = String(item.role || "").toLowerCase().trim();
                let badgeClass = 'badge-other';
                
                // 強大模糊辨識邏輯 (不分大小寫)
                if (r.includes('pilot')) { counts.p++; badgeClass = 'badge-pilot'; }
                else if (r.includes('engineer')) { counts.e++; badgeClass = 'badge-engineer'; }
                else if (r.includes('scientist')) { counts.s++; badgeClass = 'badge-scientist'; }

                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-50 hover:bg-white/50 transition-colors";
                tr.innerHTML = `
                    <td class="p-3 font-medium text-gray-700">${item.name || 'Unknown'}</td>
                    <td class="p-3 text-center"><span class="badge ${badgeClass}">${item.role}</span></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalCount').innerText = data.length;
            document.getElementById('pilotCount').innerText = counts.p;
            document.getElementById('engineerCount').innerText = counts.e;
            document.getElementById('scientistCount').innerText = counts.s;
            updateChart(counts);
        }

        function updateChart(c) {
            const ctx = document.getElementById('roleChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Pilot','Engineer','Scientist'],
                    datasets: [{
                        data: [c.p, c.e, c.s],
                        backgroundColor: ['#38bdf8', '#c084fc', '#f472b6'],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: { 
                    plugins: { 
                        legend: { position: 'bottom', labels: { usePointStyle: true, pointStyleWidth: 10 } } 
                    },
                    maintainAspectRatio: false,
                    animation: { animateScale: true, animateRotate: true }
                }
            });
        }

        window.onload = fetchData;
    </script>
</body>
</html>
