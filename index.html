<style>
    /* 讓載入中的星星旋轉更平滑 */
    #refreshIcon {
        display: inline-block;
        animation: spin 2s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* 骨架屏效果：在資料還沒出來前，讓卡片看起來在發光 */
    .skeleton {
        background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0.1) 75%);
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
    }
    @keyframes loading { to { background-position: -200% 0; } }
</style>

<script>
    // 優化後的 fetchData 函數
    function fetchData() {
        const btn = document.getElementById('refreshBtn');
        const icon = document.getElementById('refreshIcon');
        
        // 按鈕點擊後的視覺反饋
        btn.disabled = true;
        btn.style.opacity = "0.7";
        icon.classList.remove('hidden');

        // 使用 Promise 設定逾時，避免網頁無限期等待
        const fetchPromise = fetch(scriptURL).then(r => r.json());
        const timeoutPromise = new Promise((_, reject) => 
            setTimeout(() => reject(new Error('連線逾時')), 15000)
        );

        Promise.race([fetchPromise, timeoutPromise])
            .then(res => {
                if (res.result === 'success') {
                    render(res.data || []);
                    // 資料載入成功後，將內容存入本地快取 (LocalStorage)
                    localStorage.setItem('last_star_data', JSON.stringify(res.data));
                }
            })
            .catch(err => {
                console.error("讀取失敗:", err);
                // 如果失敗，嘗試從本地快取讀取舊資料
                const cache = localStorage.getItem('last_star_data');
                if (cache) {
                    alert("網路較慢，顯示快取資料中...");
                    render(JSON.parse(cache));
                }
            })
            .finally(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
                document.getElementById('dashboardContent').classList.remove('hidden');
                btn.disabled = false;
                btn.style.opacity = "1";
                icon.classList.add('hidden');
            });
    }

    // 初始化時先檢查是否有快取資料，有的話先顯示，不等 API
    window.onload = () => {
        const cache = localStorage.getItem('last_star_data');
        if (cache) {
            render(JSON.parse(cache));
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('dashboardContent').classList.remove('hidden');
        }
        fetchData(); // 靜默在後台更新最新資料
    };
</script>
