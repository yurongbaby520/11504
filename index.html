<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星幻指揮中心 - 粉嫩觀測站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- 基礎粉嫩設定 --- */
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            /* 夢幻粉藍漸層背景 */
            background: linear-gradient(135deg, #fff1f2 0%, #e0f2fe 100%);
            color: #475569; 
            margin: 0; 
            min-height: 100vh; 
            overflow-x: hidden; 
            position: relative;
        }

        /* --- 1. 夢幻星星背景 --- */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.5) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.4) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.3) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            z-index: -1;
            opacity: 0.9; /* 在亮色背景下稍微顯眼一點 */
        }

        /* --- 2. 動態流星雨 (白潤感) --- */
        .shooting-stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .shooting-star {
            position: absolute;
            width: 120px;
            height: 2px;
            /* 輕盈的白色流星 */
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(-35deg);
            opacity: 0;
            animation: shoot 8s linear infinite;
        }

        @keyframes shoot {
            0% { transform: rotate(-35deg) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: rotate(-35deg) translateX(-1200px); opacity: 0; }
            100% { transform: rotate(-35deg) translateX(-1200px); opacity: 0; }
        }

        /* 設定不同流星的延遲和位置 */
        .shooting-star:nth-child(1) { top: 5%; right: 15%; animation-delay: 0s; }
        .shooting-star:nth-child(2) { top: 25%; right: -5%; animation-delay: 1.5s; animation-duration: 10s; }
        .shooting-star:nth-child(3) { top: 45%; right: 25%; animation-delay: 3s; animation-duration: 7s; }
        .shooting-star:nth-child(4) { top: 10%; right: 35%; animation-delay: 5s; }
        .shooting-star:nth-child(5) { top: 65%; right: 10%; animation-delay: 7s; animation-duration: 13s;}

        /* --- 3. 白潤玻璃介面 --- */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.5); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.7); 
            /* 輕盈的陰影 */
            box-shadow: 0 10px 30px rgba(244, 114, 182, 0.05); 
            border-radius: 1.25rem; 
        }

        /* --- 4. 粉嫩霓虹文字 --- */
        .metallic-text { 
            background: linear-gradient(to right, #7dd3fc 0%, #f472b6 33%, #d8b4fe 66%, #7dd3fc 100%); 
            background-size: 200% auto;
            color: transparent; 
            -webkit-background-clip: text; 
            background-clip: text; 
            font-weight: 900; 
            animation: metallicFlow 6s linear infinite;
            /* 柔和的粉色發光 */
            filter: drop-shadow(0 0 3px rgba(244,114,182,0.4));
        }

        @keyframes metallicFlow { to { background-position: 200% center; } }

        /* --- 5. 數據卡片珍珠光澤 shadow --- */
        .stat-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(244, 114, 182, 0.4);
            /* 珍珠彩光陰影 */
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.15), 0 0 10px rgba(125, 211, 252, 0.1);
        }

        /* 職位標籤 (維持原本粉嫩感) */
        .badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-align: center; }
        .badge-pilot { background: #e0f2fe; color: #0284c7; text-transform: uppercase;}
        .badge-engineer { background: #f3e8ff; color: #7e22ce; text-transform: uppercase;}
        .badge-scientist { background: #fce7f3; color: #db2777; text-transform: uppercase;}
        .badge-other { background: #f1f5f9; color: #64748b; }

        /* 載入動畫 (粉嫩) */
        .loading-dot { animation: loadingBreath 1.5s ease-in-out infinite; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes loadingBreath { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }

        /* 表格進場動畫 */
        #tableBody tr {
            opacity: 0;
            transform: translateY(20px);
            animation: trSlideIn 0.5s ease forwards;
        }
        #tableBody tr:nth-child(1) { animation-delay: 0.1s; }
        #tableBody tr:nth-child(2) { animation-delay: 0.2s; }
        #tableBody tr:nth-child(3) { animation-delay: 0.3s; }
        @keyframes trSlideIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="stars"></div>
    <div class="shooting-stars-container">
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
        <div class="shooting-star"></div>
    </div>

    <div class="max-w-7xl mx-auto space-y-8 relative z-10">
        <div class="glass-panel p-6 sm:p-10 flex flex-col sm:flex-row justify-between items-center gap-6 shadow-sm">
            <div>
                <h2 style="font-family:'Orbitron'" class="text-pink-400 tracking-[0.3em] text-xs font-bold mb-2 uppercase">Pastel Galaxy Command monitoring</h2>
                <h1 class="text-3xl sm:text-4xl metallic-text tracking-wider">星幻數據指揮中心</h1>
            </div>
            <button onclick="fetchData()" id="refreshBtn" class="flex items-center gap-2 px-6 py-3 bg-white text-pink-500 hover:bg-pink-50 rounded-xl font-bold shadow-[0_5px_15px_rgba(244,114,182,0.1)] hover:shadow-[0_8px_25px_rgba(244,114,182,0.2)] transition-all active:scale-95">
                <span id="refreshIcon" class="hidden animate-spin">♻️</span>
                同步星際數據
            </button>
        </div>

        <div id="loadingScreen" class="flex flex-col items-center justify-center py-20">
            <div class="flex space-x-2 mb-4">
                <div class="w-3 h-3 bg-pink-300 rounded-full loading-dot"></div>
                <div class="w-3 h-3 bg-purple-300 rounded-full loading-dot"></div>
                <div class="w-3 h-3 bg-sky-300 rounded-full loading-dot"></div>
            </div>
            <p class="text-pink-400 font-medium">解碼來自 Google Sheets 的信號...</p>
        </div>

        <div id="dashboardContent" class="hidden space-y-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 text-center">
                <div class="glass-panel p-6 stat-card"><p class="text-slate-500 text-sm font-bold">總人數</p><h3 class="text-4xl font-black text-slate-800" id="totalCount">0</h3></div>
                <div class="glass-panel p-6 stat-card border-b-4 border-sky-300"><p class="text-sky-600 text-sm font-bold uppercase">Pilot</p><h3 class="text-4xl font-black text-sky-500" id="pilotCount">0</h3></div>
                <div class="glass-panel p-6 stat-card border-b-4 border-purple-300"><p class="text-purple-600 text-sm font-bold uppercase">Engineer</p><h3 class="text-4xl font-black text-purple-500" id="engineerCount">0</h3></div>
                <div class="glass-panel p-6 stat-card border-b-4 border-pink-300"><p class="text-pink-600 text-sm font-bold uppercase">Scientist</p><h3 class="text-4xl font-black text-pink-500" id="scientistCount">0</h3></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="glass-panel p-6 flex flex-col items-center shadow-sm">
                    <h3 class="font-bold mb-4 text-slate-700">職位佔比</h3>
                    <div class="w-full max-w-[200px] aspect-square"><canvas id="roleChart"></canvas></div>
                </div>
                <div class="glass-panel p-6 lg:col-span-2 overflow-x-auto shadow-sm">
                    <h3 class="font-bold mb-4 text-slate-700">最新登錄成員</h3>
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-pink-500 border-b border-pink-100">
                                <th class="p-3 text-sm font-bold">成員姓名</th>
                                <th class="p-3 text-center text-sm font-bold">派駐職位</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="text-slate-600"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxOEVtSZ7GbuI30JX-ge2_X9az1J9hu_sB0VP4M7gWYD9acsPkkHr_Q8M7wrYbfaYwW/exec?get_data=1';
        let chartInstance = null;

        function fetchData() {
            document.getElementById('loadingScreen').classList.remove('hidden');
            document.getElementById('dashboardContent').classList.add('hidden');
            document.getElementById('refreshIcon').classList.remove('hidden');
            
            fetch(scriptURL)
                .then(res => res.json())
                .then(res => {
                    if (res.result === 'success') render(res.data || []);
                })
                .catch(err => console.error("Error:", err))
                .finally(() => {
                    document.getElementById('loadingScreen').classList.add('hidden');
                    document.getElementById('dashboardContent').classList.remove('hidden');
                    document.getElementById('refreshIcon').classList.add('hidden');
                });
        }

        function render(data) {
            let counts = { p: 0, e: 0, s: 0 };
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            [...data].reverse().forEach(item => {
                const r = String(item.role || "").toLowerCase().trim();
                let badgeClass = 'badge-other';
                if (r.includes('pilot')) { counts.p++; badgeClass = 'badge-pilot'; }
                else if (r.includes('engineer')) { counts.e++; badgeClass = 'badge-engineer'; }
                else if (r.includes('scientist')) { counts.s++; badgeClass = 'badge-scientist'; }

                tbody.innerHTML += `<tr class="border-b border-gray-100 hover:bg-white/40 transition-colors">
                    <td class="p-3 font-medium">${item.name || 'Unknown'}</td>
                    <td class="p-3 text-center"><span class="badge ${badgeClass}">${item.role}</span></td>
                </tr>`;
            });

            document.getElementById('totalCount').innerText = data.length;
            document.getElementById('pilotCount').innerText = counts.p;
            document.getElementById('engineerCount').innerText = counts.e;
            document.getElementById('scientistCount').innerText = counts.s;
            updateChart(counts);
        }

        function updateChart(c) {
            Chart.defaults.color = '#64748b'; // 設定圓餅圖文字顏色
            const ctx = document.getElementById('roleChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Pilot','Engineer','Scientist'],
                    datasets: [{
                        data: [c.p, c.e, c.s],
                        backgroundColor: ['#7dd3fc', '#d8b4fe', '#f9a8d4'], // 粉嫩三色
                        borderWidth: 0,
                        hoverOffset: 15
                    }]
                },
                options: { 
                    plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, pointStyleWidth: 10 } } },
                    maintainAspectRatio: false,
                    animation: { animateScale: true, animateRotate: true }
                }
            });
        }
        window.onload = fetchData;
    </script>
</body>
</html>
